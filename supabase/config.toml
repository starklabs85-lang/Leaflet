project_id = "gnrjqqoidzuwzvhhfggh"

[auth]
enable_anonymous_sign_ins = true
enable_manual_linking = true

[functions.identify-plant]
verify_jwt = true

[functions.weather-tips]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.process-appsflyer-erasure]
verify_jwt = true

# RevenueCat calls this with its own shared-secret Authorization header, not a
# Supabase JWT; the function verifies REVENUECAT_WEBHOOK_SECRET itself.
[functions.revenuecat-webhook]
verify_jwt = false

# Public monitor endpoint; the handler returns only fixed health fields.
[functions.production-health]
verify_jwt = false

# Supports an operations HMAC and authenticated mobile reports in the handler.
[functions.production-incident]
verify_jwt = false
